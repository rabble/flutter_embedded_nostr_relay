name: flutter_embedded_nostr_relay
description: "A self-contained Nostr relay that runs inside Flutter apps, providing instant local responses while intelligently managing external relay connections and P2P synchronization"
version: 0.1.0
repository: https://github.com/OpenVine/flutter_embedded_nostr_relay
issue_tracker: https://github.com/OpenVine/flutter_embedded_nostr_relay/issues
documentation: https://github.com/OpenVine/flutter_embedded_nostr_relay

environment:
  sdk: ^3.8.1
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Core dependencies
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  web_socket_channel: ^3.0.1
  shelf: ^1.4.2
  shelf_web_socket: ^2.0.0
  crypto: ^3.0.5
  convert: ^3.1.2
  
  # JSON and serialization
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  
  # Connectivity and networking
  connectivity_plus: ^6.0.5
  http: ^1.2.2
  
  # Platform-specific features
  flutter_blue_plus: ^1.35.5
  nearby_connections: ^4.3.0
  
  # Storage and caching
  path_provider: ^2.1.5
  path: ^1.9.0
  
  # Utilities
  collection: ^1.19.0
  async: ^2.12.0
  stream_transform: ^2.1.0
  rxdart: ^0.28.0
  logging: ^1.3.0
  uuid: ^4.5.1
  
  # FFI for Tor support (optional)
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  test: ^1.25.8
  mockito: ^5.4.5
  fake_async: ^1.3.2
  benchmark_harness: ^2.3.0

